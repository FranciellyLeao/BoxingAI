name: Build iOS IPA (AltStore PAL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-generate iOS Xcode project files
        run: flutter create . --platforms=ios --org com.boxing.ai

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install || true
          cd ..

      - name: Build iOS App Bundle without Codesign (Dummy Team)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="1234567890" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Create Payload and Zip to IPA
        run: |
          mkdir -p build/ios/ipa_payload/Payload
          find . -name "Runner.app" -type d -exec cp -R {} build/ios/ipa_payload/Payload/ \;
          cd build/ios/ipa_payload
          zip -r ../BoxingAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxingAI-iOS-IPA
          path: build/ios/BoxingAI.ipa
